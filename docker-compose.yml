name: hotelbooking

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotelbooking-api:latest
    container_name: hotelbooking-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HotelReservationsDB;User Id=sa;Password=${SA_PASSWORD:-Your_strong_password123!};TrustServerCertificate=true;Encrypt=False"
      Jwt__Key: "${JWT_KEY:-ZmFrZS1qd3Qta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9u}"
    ports:
      - "8080:8080"
    networks:
      - hotelbooking-net
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hotelbooking-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Your_strong_password123!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hotelbooking-net
    restart: unless-stopped

volumes:
  sqlserver-data:

networks:
  hotelbooking-net:
    driver: bridge
